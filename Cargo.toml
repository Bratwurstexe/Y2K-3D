[package]
name = "y2k-3d"
version = "1.1.0"
edition = "2021"
description = "A native Windows 3D landscape studio: terrains, skies, materials, a ray tracer, keyframe animation and a built-in Claude assistant."
license = "MIT"
repository = "https://github.com/Bratwurstexe/Y2K-3D"
readme = "README.md"
keywords = ["3d", "landscape", "raytracer", "terrain", "egui"]
categories = ["graphics", "rendering"]

[[bin]]
name = "Y2K-3D"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
glam = { version = "0.34", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg", "bmp", "webp"] }
rfd = "0.18"
rayon = "1.12"
ureq = { version = "3", default-features = false, features = ["native-tls", "json", "gzip"] }
gltf = "1.4"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
